<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción - Clasificador IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="container-fluid px-4 py-4" id="app">
        <h2>Realizar Predicción</h2>

        <!-- Seleccionar modelo -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <label class="form-label">Modelo entrenado</label>
                <select id="modelSelect" class="form-select">
                    <option value="">Cargando modelos...</option>
                </select>
            </div>
        </div>

        <!-- Pestañas: manual / CSV -->
        <ul class="nav nav-tabs" id="predictionTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#manualTab">Predicción Manual</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#csvTab">Predicción por CSV</button>
            </li>
        </ul>

        <div class="tab-content mt-3">
            <!-- Manual -->
            <div class="tab-pane fade show active" id="manualTab">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="manualForm">
                            <div id="featureInputs">Selecciona un modelo para ver las variables.</div>
                            <button type="submit" class="btn btn-primary mt-3 d-none" id="predictBtn">Predecir</button>
                        </form>
                        <div id="manualResult" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- CSV -->
            <div class="tab-pane fade" id="csvTab">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="csvForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Archivo CSV con datos a predecir</label>
                                <input type="file" class="form-control" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-file-earmark-arrow-down"></i> Predecir y Descargar</button>
                        </form>
                        <div id="csvResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('sidebar.html').then(r => r.text()).then(html => document.getElementById('sidebar-placeholder').innerHTML = html);

        const modelSelect = document.getElementById('modelSelect');
        const featureInputs = document.getElementById('featureInputs');
        const predictBtn = document.getElementById('predictBtn');
        const manualForm = document.getElementById('manualForm');
        const manualResult = document.getElementById('manualResult');
        const csvForm = document.getElementById('csvForm');
        const csvResult = document.getElementById('csvResult');

        // Cargar modelos entrenados
        async function loadModels() {
            const trainings = await api.getTrainings();
            modelSelect.innerHTML = '<option value="">Selecciona modelo</option>' +
                trainings.map(t => `<option value="${t.id}">ID: ${t.id} - ${t.target_column} (Acc: ${(t.accuracy*100).toFixed(1)}%)</option>`).join('');
        }

        // Cuando cambia el modelo, cargar sus características (obtenidas de un endpoint adicional)
        // Como no tenemos endpoint directo para obtener feature_names, podemos almacenarlas en el training o 
        // hacer una llamada adicional. Para simplificar, al seleccionar un modelo, podríamos pedir al usuario
        // que ingrese manualmente, pero lo mejor es agregar un endpoint en el backend que devuelva feature_names.
        // Aquí asumiremos que tenemos un endpoint /api/training/<id> que incluye 'feature_names' en el futuro.
        // Por ahora, mostraremos un campo de texto para ingresar las variables manualmente si no podemos obtenerlas.

        // Dado que el backend actual no expone feature_names, podemos añadir un endpoint simple:
        // Pero mientras tanto, usaremos un enfoque: al seleccionar modelo, hacemos fetch a /api/training/<id> 
        // y si existe feature_names las usamos, si no, pedimos al usuario que ingrese los nombres separados por coma.
        // Voy a modificar el training_detail para devolver feature_names. (Lo añadiré después)
        // Para que funcione ahora, pondré un campo de texto donde el usuario pueda escribir las features.
        
        modelSelect.addEventListener('change', async () => {
            const id = modelSelect.value;
            if (!id) {
                featureInputs.innerHTML = 'Selecciona un modelo.';
                predictBtn.classList.add('d-none');
                return;
            }
            // Intentar obtener feature_names del endpoint de detalle
            try {
                const res = await fetch(`${api.API_BASE}/training/${id}`);
                const data = await res.json();
                if (data.feature_names && data.feature_names.length > 0) {
                    generateInputs(data.feature_names);
                } else {
                    // Fallback: pedir features al usuario
                    featureInputs.innerHTML = '<label class="form-label">Nombres de las variables (separados por coma)</label><input type="text" class="form-control" id="featuresInput" placeholder="ej: sepal_length,petal_width"><button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="loadFeaturesBtn">Cargar campos</button>';
                    document.getElementById('loadFeaturesBtn').addEventListener('click', () => {
                        const features = document.getElementById('featuresInput').value.split(',').map(s => s.trim());
                        generateInputs(features);
                    });
                }
            } catch (err) {
                featureInputs.innerHTML = 'Error al cargar modelo.';
            }
        });

        function generateInputs(features) {
            featureInputs.innerHTML = features.map(f => `
                <div class="mb-3">
                    <label class="form-label">${f}</label>
                    <input type="text" class="form-control" name="${f}" required>
                </div>
            `).join('');
            predictBtn.classList.remove('d-none');
        }

        // Predicción manual
        manualForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const trainingId = modelSelect.value;
            const formData = new FormData(manualForm);
            try {
                const res = await api.predictManual(trainingId, formData);
                if (res.error) {
                    manualResult.innerHTML = `<div class="alert alert-danger">${res.error}</div>`;
                    return;
                }
                manualResult.innerHTML = `
                    <div class="alert alert-success">
                        <strong>Predicción:</strong> ${res.prediction}<br>
                        <strong>Probabilidad:</strong> ${res.probability}%<br>
                        <small>${JSON.stringify(res.all_probabilities)}</small>
                    </div>`;
            } catch (err) {
                manualResult.innerHTML = '<div class="alert alert-danger">Error de conexión</div>';
            }
        });

        // Predicción CSV
        csvForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const trainingId = modelSelect.value;
            const formData = new FormData(csvForm);
            csvResult.innerHTML = '<div class="alert alert-info">Procesando...</div>';
            try {
                const blob = await api.predictCsv(trainingId, formData);
                // Descargar archivo
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'predictions.csv';
                a.click();
                csvResult.innerHTML = '<div class="alert alert-success">Descarga iniciada.</div>';
            } catch (err) {
                csvResult.innerHTML = '<div class="alert alert-danger">Error en la predicción.</div>';
            }
        });

        loadModels();
    </script>
</body>
</html>
